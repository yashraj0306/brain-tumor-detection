name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "yr4352@srmist.edu.in"
          git config --global user.name "Yash Raj"
          git remote add hf https://yashraj0306:$HF_TOKEN@huggingface.co/spaces/yashraj0306/brain-tumor-detection
          git push hf main --force